trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

  steps:
  - task: NodeTool@0
    inputs:
        versionSpec: '18.x'
    displayName: 'Install Node.js'

  - script: |
        cd server
        npm install
    displayName: 'Install Backend'

  - script: |
        cd client
        npm install
        npm run build
    displayName: 'Build Frontend'